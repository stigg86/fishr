name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
    
    - name: Install Capacitor
      run: npm install @capacitor/core @capacitor/cli @capacitor/android
    
    - name: Setup web dir
      run: |
        mkdir -p web
        cp index.html manifest.json sw.js icon-*.png fish*.jpg web/
    
    - name: Initialize Capacitor
      run: npx cap init FISHR com.fishr.app --web-dir=web
    
    - name: Add Android
      run: npx cap add android
    
    - name: Sync
      run: npx cap sync android
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon 2>&1
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: fishr-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
