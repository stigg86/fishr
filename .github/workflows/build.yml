name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: /home/umbrel/umbrel/external/fishr-app/package-lock.json
    
    - name: Install Capacitor
      run: npm install @capacitor/core @capacitor/cli @capacitor/android
    
    - name: Initialize Capacitor
      run: npx cap init FISHR com.fishr.app --web-dir=.
    
    - name: Add Android platform
      run: npx cap add android
    
    - name: Copy web assets
      run: |
        cp index.html .
        cp manifest.json .
        cp sw.js .
        cp -r icon-*.png .
        cp -r fish*.jpg . 2>/dev/null || true
    
    - name: Build web app
      run: npm run build || echo "No build script needed"
    
    - name: Sync to Android
      run: npx cap sync android
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Build debug APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fishr-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
