name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    
    - name: Install dependencies
      run: npm install @capacitor/core @capacitor/cli @capacitor/android
    
    - name: Create web dir and copy assets
      run: |
        mkdir -p web
        cp index.html manifest.json sw.js icon-*.png fish*.jpg web/ 2>/dev/null || true
    
    - name: Initialize Capacitor (skip if exists)
      run: |
        if [ ! -f capacitor.config.json ]; then
          npx cap init FISHR com.fishr.app --web-dir=web
        fi
    
    - name: Add Android and sync
      run: |
        npx cap add android || true
        npx cap sync android
    
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    - name: Build APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fishr-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
